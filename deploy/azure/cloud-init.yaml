#cloud-config
# Runs once, on the VM's first boot. Installs Docker, adds swap, and fetches
# the three deployment files from the public repo -- so a freshly created VM is
# ready for `docker compose up` without anything being copied to it by hand.
#
# It deliberately does NOT start the stack: .env has to be filled in with real
# secrets first.

package_update: true
package_upgrade: false

write_files:
  # 2 GB of swap. A B1s has 1 GB of RAM and MySQL is the first thing the OOM
  # killer reaches for; swap costs nothing and turns a 3am outage into a slow
  # minute. Written as a unit so it survives reboots without fstab editing.
  - path: /etc/systemd/system/lms-swap.service
    permissions: '0644'
    content: |
      [Unit]
      Description=Create and enable a 2G swapfile
      ConditionPathExists=!/swapfile

      [Service]
      Type=oneshot
      RemainAfterExit=yes
      ExecStart=/bin/bash -c "fallocate -l 2G /swapfile && chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile && grep -q '^/swapfile' /etc/fstab || echo '/swapfile none swap sw 0 0' >> /etc/fstab"

      [Install]
      WantedBy=multi-user.target

  - path: /opt/lms/fetch-deploy-files.sh
    permissions: '0755'
    content: |
      #!/usr/bin/env bash
      # Pulls the deployment files straight from the public repo, so upgrading
      # them later is one command rather than an scp dance.
      set -euo pipefail
      RAW=https://raw.githubusercontent.com/UsmanHaiderWeb/Library-Management-System---Backend/main/deploy
      cd /opt/lms
      for f in docker-compose.ghcr.yml Caddyfile bootstrap.sh; do
          curl -fsSL "$RAW/$f" -o "$f"
          echo "fetched $f"
      done
      [ -f .env ] || curl -fsSL "$RAW/.env.example" -o .env
      chmod +x bootstrap.sh
      echo
      echo "Deployment files are in /opt/lms. Next:"
      echo "  1. edit /opt/lms/.env"
      echo "  2. docker compose -f docker-compose.ghcr.yml pull"
      echo "  3. docker compose -f docker-compose.ghcr.yml up -d"
      echo "  4. ./bootstrap.sh"

runcmd:
  # Docker from Docker's own repository -- Ubuntu's packaged docker.io has no
  # compose plugin, which this deployment depends on.
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
  - chmod a+r /etc/apt/keyrings/docker.asc
  - >
    echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc]
    https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo "$VERSION_CODENAME") stable"
    > /etc/apt/sources.list.d/docker.list
  - apt-get update -y
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
  - systemctl enable --now docker
  # So the admin user can run docker without sudo (takes effect next login)
  - usermod -aG docker ${ADMIN_USERNAME}
  - systemctl enable --now lms-swap.service
  - chown -R ${ADMIN_USERNAME}:${ADMIN_USERNAME} /opt/lms
  - su - ${ADMIN_USERNAME} -c /opt/lms/fetch-deploy-files.sh
  # Unattended security updates: this box will outlive anyone's attention span
  - apt-get install -y unattended-upgrades
  - dpkg-reconfigure -f noninteractive unattended-upgrades

final_message: "LMS host ready after $UPTIME seconds. Deployment files are in /opt/lms."
